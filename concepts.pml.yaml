managed_task:
  meaning: >-
    Accepted software-delivery work governed through distinct open, planning,
    decomposed, working, in-review, rework, merging, done, terminal-failure, and
    cancelled lifecycle states.
admission_ready:
  meaning: >-
    A classifier decision that work is sufficiently clear and bounded for its assigned
    delivery path, distinct from runtime dependency eligibility.
coding_run:
  meaning: One daemon-authorized coding execution assigned to one Managed Task and role.
  states:
    - starting
    - active
    - awaiting signal
    - interrupted
    - failed
    - finished
proposed_change:
  meaning: The branch and pull request produced or revised for one Managed Task.
  states:
    - open
    - under review
    - changes required
    - approved
    - merged
    - closed
base_revision:
  meaning: The exact target revision against which a Proposed Change is evaluated.
review_verdict:
  meaning: An attested approval or changes-required result for one Proposed Change revision.
delivery_hold:
  meaning: A durable condition preventing unsafe lifecycle progression.
decomposition_plan:
  meaning: A bounded proposal for an acyclic set of smaller implementation Managed Tasks.
  states:
    - proposed
    - rejected
    - accepted
task_graph:
  meaning: Accepted generated Managed Tasks, source relationship, and delivery dependencies.
  states:
    - active
    - blocked
    - done
    - cancelled
planning_blocker:
  meaning: Evidence that safe decomposition requires clarification or owner intervention.
