managed_task:
  meaning: >-
    Accepted software-delivery work governed through distinct open, planning,
    decomposed, working, in-review, rework, merging, done, terminal-failure, and
    cancelled lifecycle states.
admission_ready:
  meaning: >-
    A classifier decision that work is sufficiently clear and bounded for its assigned
    delivery path, distinct from runtime dependency eligibility.
coding_run:
  meaning: One daemon-authorized coding execution assigned to one Managed Task and role.
  states:
    - starting
    - active
    - awaiting signal
    - interrupted
    - failed
    - finished
proposed_change:
  meaning: The branch and pull request produced or revised for one Managed Task.
  states:
    - open
    - under review
    - changes required
    - approved
    - merged
    - closed
base_revision:
  meaning: The exact target revision against which a Proposed Change is evaluated.
review_verdict:
  meaning: An attested approval or changes-required result for one Proposed Change revision.
delivery_hold:
  meaning: A durable condition preventing unsafe lifecycle progression.
decomposition_plan:
  meaning: A bounded proposal for an acyclic set of smaller implementation Managed Tasks.
  states:
    - proposed
    - rejected
    - accepted
task_graph:
  meaning: Accepted generated Managed Tasks, source relationship, and delivery dependencies.
  states:
    - active
    - blocked
    - done
    - cancelled
planning_blocker:
  meaning: Evidence that safe decomposition requires clarification or owner intervention.
review_finding:
  meaning: >-
    Evidence-backed reviewer observation classified independently by technical impact
    and merge disposition.
follow_up_artifact:
  meaning: >-
    Durable normalized evidence for a non-blocking concern that may justify future
    Managed Task.
  states:
    - collected
    - assessing
    - accepted
    - linked
    - dismissed
    - deferred
review_interpretation:
  meaning: >-
    A bounded retrospective classification of a final Proposed Change review record.
  states:
    - pending
    - succeeded
    - failed
follow_up_assessment:
  meaning: >-
    A Planning Agent decision accounting for a complete supplied Follow-up Artifact
    batch.
  states:
    - pending
    - assessing
    - completed
    - failed
planning_lineage:
  meaning: >-
    Durable source intent, accepted planning decisions, and delivery relationships used
    to reconstruct planning context.
hosted_repository:
  meaning: >-
    One registered source repository with a globally unique identity composed of its account
    and repository names, and its isolated Quorum runtime, durable coordination state, managed
    coding contexts, and repository-scoped authorization.
  states:
    - provisioning
    - available
    - suspended
    - unavailable
    - deleted
vendor_credential:
  meaning: >-
    A secret supplied or authorized for use with one supported external AI provider.
  states:
    - active
    - revoked
access_grant:
  meaning: >-
    Revocable authority for one identity to perform an allowed set of operations against
    explicitly selected Hosted Repositories.
  states:
    - active
    - expired
    - revoked
service_account:
  meaning: >-
    The hosted-service ownership boundary for one Service User, its Hosted Repositories,
    Vendor Credentials, and Access Grants.
  states:
    - active
    - cancelled
