Managed Task:
  meaning: Accepted software-delivery work governed through the Quorum lifecycle.
  forbidden_synonyms:
    - job
Admission Ready:
  meaning: >-
    A classifier decision that a Managed Task is sufficiently clear and bounded for its
    assigned delivery path, independent of runtime dependency eligibility.
Coding Run:
  meaning: One daemon-authorized coding execution assigned to one Managed Task and role.
Proposed Change:
  meaning: The branch and pull request produced or revised for one Managed Task.
Base Revision:
  meaning: The exact target revision against which a Proposed Change is evaluated.
Review Verdict:
  meaning: An attested approval or changes-required result for one Proposed Change revision.
Delivery Contract:
  meaning: >-
    The lifecycle authority, isolation, review, verification, and merge protections
    every Supported Coding Runner must preserve.
Supported Coding Runner:
  meaning: >-
    A coding execution mechanism proven capable of satisfying the Delivery Contract.
Required Checks:
  meaning: Delivery checks that must pass before a Proposed Change may merge.
Rework Attempt:
  meaning: Continued implementation responding to blocking evidence on a Proposed Change.
Delivery Hold:
  meaning: A durable condition preventing unsafe lifecycle progression.
Planning Agent:
  meaning: >-
    A frontier-model, repository-aware, read-only coding execution authorized to
    propose bounded implementation work for one oversized Managed Task.
Decomposition Plan:
  meaning: >-
    A bounded proposal that maps one oversized Managed Task into an acyclic set of
    smaller implementation Managed Tasks and their delivery dependencies.
Task Graph:
  meaning: >-
    The accepted set of generated Managed Tasks, their source relationship, and their
    delivery dependencies.
Planning Blocker:
  meaning: >-
    Concrete evidence that a Managed Task cannot be decomposed safely without changed
    intent, additional information, or owner intervention.
Plan Arbiter:
  meaning: >-
    A single-shot, stateless, read-only model reviewer spawned fresh per Decomposition
    Plan in the planner's frozen repository view to judge faithfulness, coverage and
    non-overlap, coherence, and decomposability.
Plan Verdict:
  meaning: >-
    The one closed Plan Arbiter result for one Decomposition Plan: approve, changes with
    findings, or reject source.
Frontier Planning Model:
  meaning: >-
    The owner-approved highest-capability model for repository-aware planning on a
    supported provider.
Review Finding:
  meaning: >-
    Evidence-backed reviewer observation with independent technical impact and merge
    disposition.
Follow-up Artifact:
  meaning: >-
    Durable normalized evidence for a non-blocking concern that may justify future
    Managed Task after the originating Proposed Change is final.
Review Interpretation:
  meaning: >-
    A bounded retrospective classification of the final review record into durable
    Review Findings and Follow-up Artifacts.
Planning Lineage:
  meaning: >-
    Durable source intent, accepted planning decisions, and delivery relationships
    supplied to later planning without relying on a live Planning Agent session.
Follow-up Assessment:
  meaning: >-
    A Planning Agent decision that creates, links, dismisses, or defers each supplied
    Follow-up Artifact.
Hosted Repository:
  meaning: >-
    One registered source repository and its repository-scoped hosted Quorum runtime.
Vendor Credential:
  meaning: >-
    A secret supplied or authorized for one supported external AI provider.
Access Grant:
  meaning: >-
    Revocable, repository-scoped authority for an authenticated person or agent.
Service Account:
  meaning: >-
    The hosted-service ownership boundary for one Service User and its hosted resources.
