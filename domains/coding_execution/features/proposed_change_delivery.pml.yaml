purpose: Convert implementation work into a durable Proposed Change whose repository
  state is authoritative for delivery.
actors:
- coordination_daemon
- coding_worker
- repository_service
emits:
- proposed_change_submitted
- proposed_revision_changed
rules:
  repository_is_authoritative:
    statement: The Coordination Daemon MUST use Repository Service state as authoritative
      for Proposed Change identity, revision, and disposition.
  signaled_change_must_exist:
    statement: The Coordination Daemon MUST reject a completion signal whose Proposed
      Change does not exist or is not open.
  branch_must_match:
    statement: The Coordination Daemon MUST reject a Proposed Change that does not
      use the Managed Task's assigned branch.
  change_identity_is_durable:
    statement: The Coordination Daemon MUST preserve the association between a Managed
      Task and its Proposed Change across restart.
use_cases:
  submit_proposed_change:
    actor: coding_worker
    goal: Submit completed implementation for independent review.
    given:
    - The assigned branch contains the intended implementation.
    - The Proposed Change is open in the Repository Service.
    when:
    - The Coding Worker signals the Proposed Change.
    then:
    - The Coordination Daemon verifies its branch, revision, and repository state.
    - The Managed Task becomes eligible for independent review.
    otherwise:
    - The signal is rejected without advancing the Managed Task.
behaviors:
  acceptance_outcomes:
    output:
      statement: >-
        One durable reviewable Proposed Change associated with its Managed Task across restart.
    rules:
      durable_reviewable_change:
        statement: An accepted completion signal MUST identify an open Proposed Change
          on the Managed Task's assigned branch and remain associated across restart.
  human_review_context:
    output:
      statement: >-
        One concise Proposed Change description that lets a human understand the assigned outcome and delivered evidence.
    rules:
      originating_task_is_visible:
        statement: The Proposed Change description MUST identify its Managed Task and include
          the accepted title and task body, or state explicitly that no task body was provided.
      delivery_summary_is_visible:
        statement: The Proposed Change description MUST distinguish the delivered change
          summary from the originating task context.
      verification_is_visible:
        statement: The Proposed Change description MUST identify the verification reported
          for the delivered revision and MUST distinguish missing verification from passing evidence.
      presentation_is_structured:
        statement: Quorum-owned Proposed Change presentation MUST use stable readable sections
          and MUST NOT substitute raw agent transcripts or progress chatter for a delivery description.
