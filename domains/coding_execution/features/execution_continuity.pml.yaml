purpose: Preserve one Delivery Contract across Supported Coding Runners without fabricating
  unsupported capabilities or allowing runner failures to advance work.
actors:
- coordination_daemon
- coding_worker
- code_reviewer
emits:
- coding_run_failed
- coding_run_interrupted
behaviors:
  run_authority:
    output:
      statement: One Coding Run with lifecycle authority unchanged by its selected runner.
    rules:
      same_delivery_contract:
        statement: Every Supported Coding Runner MUST satisfy the same Delivery Contract.
      scoped_authority:
        statement: The Coordination Daemon MUST scope each Coding Run to its assigned
          Managed Task and delivery role.
      provider_does_not_merge:
        statement: A Coding Run MUST NOT acquire authority to mark a Managed Task
          done or perform the protected merge.
      unsupported_limit_rejected:
        statement: The Coordination Daemon MUST reject startup when a configured safety
          limit cannot be enforced by the selected Supported Coding Runner.
      equivalent_runner_authority:
        statement: Changing the Supported Coding Runner MUST NOT change task, review,
          or merge authority.
  task_handoff:
    output:
      statement: >-
        One durable lifecycle handoff that lets a transient Coding Run end while its Managed Task continues.
    rules:
      task_state_is_daemon_owned:
        statement: >-
          A Coding Run MUST signal an outcome, and the Coordination Daemon MUST own the
          resulting Managed Task lifecycle transition.
      run_state_is_distinct:
        statement: >-
          Ending or discarding a Coding Run MUST NOT by itself change the lifecycle state
          of its Managed Task.
      submitted_run_is_normal:
        statement: >-
          WHEN an authoritative Proposed Change submission advances a Managed Task to
          in-review, THE SYSTEM MUST treat the worker's later termination as a
          completed handoff rather than a delivery failure.
      submitted_worker_is_disposable:
        statement: >-
          THE SYSTEM MUST allow a Coding Worker to terminate after its durable handoff
          while independent review, rework, and protected merge continue for the Managed Task.
      handoff_evidence_is_durable:
        statement: >-
          THE SYSTEM MUST retain bounded evidence linking the Coding Run identity, role,
          authoritative submission, and resulting task transition after the runner process ends.
      validation_uses_handoff_evidence:
        statement: >-
          A recovery validator MUST evaluate authoritative handoff and delivery evidence
          instead of treating one runner termination label as Managed Task lifecycle authority.
  failure_and_recovery:
    output:
      statement: >-
        One explicit fail-safe continuation or failure outcome for an interrupted Coding Run.
    rules:
      continuation_is_durable:
        statement: The Coordination Daemon MUST durably associate runner continuation
          state with its Coding Run before relying on later continuation.
      unknown_events_are_inert:
        statement: Unknown runner events MUST NOT advance a Managed Task's lifecycle.
      missing_telemetry_not_fabricated:
        statement: The Coordination Daemon MUST NOT fabricate unavailable runner usage
          or cost telemetry.
      termination_is_not_success:
        statement: A Coding Run that terminates without an authoritative completion
          signal MUST NOT advance its Managed Task toward merge or completion.
      restart_is_fail_safe:
        statement: ON FAILURE, THE SYSTEM MUST resume a Coding Run safely or reprovision
          work without weakening lifecycle protections.
      base_staleness_is_not_a_resume_failure:
        statement: >-
          WHEN an interrupted Coding Run resumes on an existing branch, THE SYSTEM MUST NOT
          fail or park the Managed Task solely because the configured base branch advanced
          after the branch was allocated; base integration is resolved at merge time.
      resume_verifies_dependency_ancestry:
        statement: >-
          WHEN a Managed Task with completed dependencies resumes on an existing branch,
          THE SYSTEM MUST verify that the branch contains each dependency's merge commit
          by ancestry, and MUST NOT require equality with the current base tip.
      resume_checks_branch_existence:
        statement: >-
          Resuming a Coding Run MUST verify that its allocated branch still exists before
          reusing it, and MUST reprovision from the base rather than fail when it does not.
      runner_failure_is_fail_safe:
        statement: Runner startup, authentication, quota, protocol, or execution failure
          MUST preserve the Managed Task without unsafe lifecycle progression.
  acceptance_outcomes:
    output:
      statement: One runner-independent delivery outcome preserving every lifecycle protection.
    rules:
      equivalent_delivery_contract:
        statement: Every Supported Coding Runner MUST complete implementation, independent
          review, rework, and completion signaling without changing lifecycle authority
          or merge protections.
      unsupported_capability_is_loud:
        statement: A configured runner capability that cannot be enforced MUST fail
          loudly before affected work begins.
rules:
  terminal_signal_is_authoritative:
    statement: The Coordination Daemon MUST derive Coding Run success or failure from
      an authoritative terminal signal and process outcome.
use_cases:
  continue_after_feedback:
    actor: coding_worker
    goal: Continue the same Managed Task after blocking review feedback.
    given:
    - A Proposed Change requires rework.
    - Durable continuation state exists for the implementation Coding Run.
    when:
    - The Coordination Daemon delivers the blocking feedback.
    then:
    - The Coding Worker continues against the existing Proposed Change.
    - Lifecycle authority remains with the Coordination Daemon.
    otherwise:
    - The Coordination Daemon reprovisions the work without treating interruption
      as success.
