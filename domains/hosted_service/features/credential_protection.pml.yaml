purpose: Use customer-authorized AI provider credentials without disclosing or retaining
  them outside their permitted scope.
actors:
  - service_user
  - coordination_daemon
architecture:
  - managed_control_plane_database
  - mvp_coding_runners
  - operational_secret_delivery
  - per_user_kms_encryption
  - provider_credential_helper
components:
  protected_storage_and_transport:
    purpose: Keep Vendor Credentials confidential outside an authorized provider use.
    rules:
      encrypted_in_transit:
        statement: Vendor Credentials MUST be encrypted whenever transmitted across a
          process, host, or network trust boundary.
      encrypted_at_rest:
        statement: Vendor Credentials MUST be encrypted whenever stored.
      plaintext_not_returned:
        statement: THE SYSTEM MUST NOT return a stored Vendor Credential's plaintext after
          accepting it.
      no_coordination_storage:
        statement: Vendor Credential plaintext MUST NOT be written to durable Quorum
          coordination state.
      no_source_storage:
        statement: Vendor Credential plaintext MUST NOT be written into customer source
          code or source-control configuration.
      no_observability_disclosure:
        statement: Vendor Credential plaintext MUST NOT be emitted through monitoring,
          logs, errors, or agent coordination responses.
  authorized_use:
    purpose: Limit credential disclosure and use to its approved runtime purpose.
    rules:
      runtime_least_privilege:
        statement: THE SYSTEM MUST disclose a Vendor Credential only to an authorized
          Coding Run that requires it for its selected provider.
      repository_scope:
        statement: A Vendor Credential MUST NOT be used outside its authorized customer
          and Hosted Repository scope.
      revocation_stops_use:
        statement: THE SYSTEM MUST prevent new use of a revoked Vendor Credential.
use_cases:
  register_vendor_credential:
    actor: service_user
    goal: Authorize hosted coding work to use an external AI provider.
    given:
      - The Service User is authorized for the selected Hosted Repository.
    when:
      - The Service User supplies or authorizes a Vendor Credential.
    then:
      - The Vendor Credential is available only within its approved scope.
      - The Service User can revoke the Vendor Credential without retrieving its plaintext.
    otherwise:
      - The Vendor Credential is not made available to Coding Runs.
