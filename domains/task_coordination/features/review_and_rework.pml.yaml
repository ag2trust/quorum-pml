purpose: Route blocking review findings into accountable revision of the existing
  Proposed Change.
actors:
- coordination_daemon
- coding_worker
- code_reviewer
rules:
  blockers_require_rework:
    statement: WHEN a Review Verdict requires changes, THE SYSTEM MUST return the
      Managed Task to implementation with its blocking findings.
  existing_change_is_reused:
    statement: The Coding Worker MUST revise the existing Proposed Change instead
      of opening a replacement Proposed Change.
  every_blocker_is_resolved:
    statement: The Coding Worker MUST fix or rebut every blocking finding with concrete
      evidence.
  changed_revision_invalidates_approval:
    statement: WHEN the Proposed Change revision changes, THE SYSTEM MUST invalidate
      prior approval for the earlier revision.
  rework_requires_fresh_review:
    statement: WHEN a Rework Attempt produces a new revision, THE SYSTEM MUST require
      fresh independent review.
  absent_worker_does_not_strand:
    statement: WHEN rework is required and the original Coding Worker is absent, THE
      SYSTEM MUST provision a Coding Worker with the existing Proposed Change and
      findings.
  exhausted_rework_fails_loudly:
    statement: WHEN the permitted Rework Attempts are exhausted, THE SYSTEM MUST fail
      the Managed Task loudly without merging it.
use_cases:
  revise_after_review:
    actor: coding_worker
    goal: Resolve blocking findings on the existing Proposed Change.
    given:
    - A Review Verdict requires changes.
    - The blocking findings and existing Proposed Change are available.
    when:
    - The Coding Worker performs a Rework Attempt.
    then:
    - Every blocking finding is fixed or rebutted with evidence.
    - The existing Proposed Change receives a new revision.
    - Fresh independent review is required.
    otherwise:
    - Unresolved findings continue to block merge.
components:
  acceptance_outcomes:
    purpose: Preserve the feature outcomes required for conforming delivery.
    rules:
      rework_preserves_accountability:
        statement: Every Rework Attempt MUST preserve a durable outcome for each blocking
          finding and receive fresh review before merge.
