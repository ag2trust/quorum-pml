purpose: Admit software-delivery work only when its responsibility and delivery path
  are unambiguous.
actors:
- task_author
- coordination_daemon
emits:
- task_accepted
rules:
  outcome_is_required:
    statement: The Task Author MUST provide an observable software-delivery outcome
      for every Managed Task.
  responsibility_is_unambiguous:
    statement: The Coordination Daemon MUST distinguish implementation work from review-only
      work before execution begins.
  dependencies_gate_execution:
    statement: WHILE a required Managed Task dependency is incomplete, THE SYSTEM
      MUST block dependent implementation.
  cancellation_stops_provisioning:
    statement: WHEN a Managed Task is cancelled, THE SYSTEM MUST NOT provision a new
      Coding Run for it.
use_cases:
  admit_implementation_work:
    actor: task_author
    goal: Submit bounded implementation work for autonomous Git delivery.
    given:
    - The desired outcome and relevant constraints are known.
    when:
    - The Task Author creates an implementation Managed Task.
    then:
    - The Managed Task becomes eligible after its dependencies complete.
    - The Coordination Daemon owns implementation through merge.
    otherwise:
    - Invalid dependencies or ambiguous responsibility are rejected.
  admit_review_only_work:
    actor: task_author
    goal: Submit an existing Proposed Change for managed independent review.
    given:
    - Implementation already exists as a Proposed Change.
    when:
    - The Task Author creates review-only work.
    then:
    - The Managed Task begins at independent review.
    - No implementation Coding Run is provisioned initially.
    otherwise:
    - A missing or invalid Proposed Change is rejected.
behaviors:
  acceptance_outcomes:
    output:
      statement: >-
        One accepted Managed Task with exactly one implementation or review-only delivery responsibility.
    rules:
      one_delivery_responsibility:
        statement: Every accepted Managed Task MUST have exactly one implementation
          or review-only delivery responsibility.
